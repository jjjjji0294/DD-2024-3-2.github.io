<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css">
        <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
        <title>Carousel (swiper)</title>
        <style>
            .swiper {
                width: 600px;
                height: 300px;
            }
            .swiper-slide > img {
                width: 100%;
            }
        </style>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css">
            <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
            <title>Carousel (swiper)</title>
            <style>
                .swiper {
                    width: 600px;
                    height: 300px;
                }
                .swiper-slide > img {
                    width: 100%;
                }
            </style>
        </head>
        <body>
            <!-- 이미지 슬라이드(캐러셀) 컨테이너 -->
            <div class="swiper swiper-initialized swiper-horizontal swiper-pointer-events swiper-backface-hidden">
                <!-- Swiper wrapper -->
                <div class="swiper-wrapper" id="swiper-wrapper-8deaf510db9c388f8" aria-live="polite" style="transform: translate3d(-600px, 0px, 0px); transition-duration: 0ms;"><div class="swiper-slide swiper-slide-duplicate swiper-slide-prev" data-swiper-slide-index="2" role="group" aria-label="3 / 3" style="width: 600px;">
                    <img src="images/image3.jpg">
                </div>
                <!-- 개별 슬라이드 -->
                <div class="swiper-slide swiper-slide-active" data-swiper-slide-index="0" role="group" aria-label="1 / 3" style="width: 600px;">
                    <img src="images/image1.jpg">
                </div>
                <div class="swiper-slide swiper-slide-next" data-swiper-slide-index="1" role="group" aria-label="2 / 3" style="width: 600px;">
                    <img src="images/image2.jpg">
                </div>
                <div class="swiper-slide swiper-slide-duplicate-prev" data-swiper-slide-index="2" role="group" aria-label="3 / 3" style="width: 600px;">
                    <img src="images/image3.jpg">
                </div>
                ...
                <div class="swiper-slide swiper-slide-duplicate swiper-slide-duplicate-active" data-swiper-slide-index="0" role="group" aria-label="1 / 3" style="width: 600px;">
                    <img src="images/image4.jpg">
                </div></div>
                <!-- 페이지 표시(pagination) -->
                <div class="swiper-pagination swiper-pagination-bullets swiper-pagination-horizontal"><span class="swiper-pagination-bullet swiper-pagination-bullet-active" aria-current="true"></span><span class="swiper-pagination-bullet"></span><span class="swiper-pagination-bullet"></span></div>
            
            <span class="swiper-notification" aria-live="assertive" aria-atomic="true"></span></div>
        
            <script>
                const Swiper = new Swiper('.swiper', {
                    // Optional parameters
                    direction: 'horizontal',
                    loop: true,
        
                    // If we need pagination
                    pagination: {
                        el: '.swiper-pagination',
                    },
        
                    // Navigation arrows
                    navigation: {
                        nextEl: '.swiper-button-next',
                        prevEl: '.swiper-button-prev',
                    }
                });
            </script>
        </body>
