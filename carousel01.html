<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bxslider/4.2.15/jquery.bxslider.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bxslider/4.2.15/jquery.bxslider.min.js"></script>
    <title>Carousel (bxSlider)</title>
</head>

<body>
    <div class="bx-wrapper" style="max-width: 600px;"><div class="bx-viewport" aria-live="polite" style="width: 100%; overflow: hidden; position: relative; height: 363px;"><div class="bxslider" style="width: 4215%; position: relative; transition-duration: 0.5s; transform: translate3d(-1090px, 0px, 0px);"><div style="float: left; list-style: none; position: relative; width: 545px;" class="bx-clone" aria-hidden="true"><img src="images/image04.jpg"></div>
        <div style="float: left; list-style: none; position: relative; width: 545px;" aria-hidden="true"><img src="images/image01.jpg"></div>
        <div aria-hidden="false" style="float: left; list-style: none; position: relative; width: 545px;"><img src="images/image02.jpg"></div>
        <div aria-hidden="true" style="float: left; list-style: none; position: relative; width: 545px;"><img src="images/image03.jpg"></div>
        <div style="float: left; list-style: none; position: relative; width: 545px;" aria-hidden="true"><img src="images/image04.jpg"></div>
    <div style="float: left; list-style: none; position: relative; width: 545px;" class="bx-clone" aria-hidden="true"><img src="images/image01.jpg"></div></div></div><div class="bx-controls bx-has-controls-direction bx-has-controls-auto bx-has-pager"><div class="bx-controls-direction"><a class="bx-prev" href="">Prev</a><a class="bx-next" href="">Next</a></div><div class="bx-controls-auto"><div class="bx-controls-auto-item"><a class="bx-start" href="">Start</a></div><div class="bx-controls-auto-item"><a class="bx-stop active" href="">Stop</a></div></div><div class="bx-pager bx-default-pager"><div class="bx-pager-item"><a href="" data-slide-index="0" class="bx-pager-link">1</a></div><div class="bx-pager-item"><a href="" data-slide-index="1" class="bx-pager-link active">2</a></div><div class="bx-pager-item"><a href="" data-slide-index="2" class="bx-pager-link">3</a></div><div class="bx-pager-item"><a href="" data-slide-index="3" class="bx-pager-link">4</a></div></div></div></div>

    <script>
        $(document).ready(function(){
            $('.bxslider').bxSlider({
                auto: true,
                autoControls: true,
                stopAutoOnClick: true,
                pager: true,
                slideWidth: 600
            });
        });
    </script>

    
</body></html>
